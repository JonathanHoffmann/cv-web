<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Jonathan Hoffmann</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="language-buttons" style="margin-left: 0;">
            <button class="only-pc"><a href="#Contact">Contact</a></button>
            <button class="only-pc"><a href="#Education">Education</a></button>
            <button class="only-pc"><a href="#Job Experience">Jobs</a></button>
            <button class="only-pc"><a href="#Volunteer Work">Volunteer</a></button>
            <button class="only-pc"><a href="#Languages">Languages</a></button>
            <button class="only-pc"><a href="#Programming Languages">Programming Languages</a></button>
            <button class="only-pc"><a href="#Programming Tools">Programming Tools</a></button>
            <button class="only-pc"><a href="#IT Support">IT Support</a></button>
            <button class="only-pc"><a href="#Other">Other</a></button>
        </div>

        <div class="language-buttons">
            <button class="active" onclick="changeLanguage('en')">
                <img src="img/en.png" alt="English" title="English">
            </button>
            <button onclick="changeLanguage('sv')">
                <img src="img/sv.jpg" alt="Svenska" title="Svenska">
            </button>
            <button onclick="changeLanguage('de')">
                <img src="img/de.jpg" alt="Deutsch" title="Deutsch">
            </button>
        </div>
    </header>

    <main>
        <section id="Contact">
            <h2>Contact</h2>
        </section>
        <section id="Education">
            <h2>Education</h2>
        </section>
        <section id="Job Experience">
            <h2>Job Experience</h2>
        </section>
        <section id="Volunteer Work">
            <h2>Volunteer Work</h2>
        </section>
        <section id="Languages">
            <h2>Languages</h2>
        </section>
        <section id="Programming Languages">
            <h2>Programming Languages</h2>
        </section>
        <section id="Programming Tools">
            <h2>Programming Tools</h2>
        </section>
        <section id="IT Support">
            <h2>IT Support</h2>
        </section>
        <section id="Other">
            <h2>Other</h2>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
