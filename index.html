<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Jonathan Hoffmann</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="language-buttons" style="margin-left: 0;">
            <button><a href="#contact">Contact</a></button>
            <button><a href="#education">Education</a></button>
            <button><a href="#jobs">Jobs</a></button>
            <button><a href="#volunteer">Volunteer</a></button>
            <button><a href="#languages">Languages</a></button>
            <button><a href="#programmingTools">Programming Tools</a></button>
            <button><a href="#programmingLanguages">Programming Languages</a></button>
            <button><a href="#itSupport">IT Support</a></button>
            <button><a href="#other">Other</a></button>
        </div>

        <div class="language-buttons">
            <button class="active" onclick="changeLanguage('en')">
                <img src="img/en.png" alt="English" title="English">
            </button>
            <button onclick="changeLanguage('sv')">
                <img src="img/sv.jpg" alt="Svenska" title="Svenska">
            </button>
            <button onclick="changeLanguage('de')">
                <img src="img/de.jpg" alt="Deutsch" title="Deutsch">
            </button>
        </div>
    </header>

    <main>
        <section id="contact">
            <h2>Contact</h2>
        </section>
        <section id="education">
            <h2>Education</h2>
        </section>
        <section id="jobs">
            <h2>Job Experience</h2>
        </section>
        <section id="volunteer">
            <h2>Volunteer Work</h2>
        </section>
        <section id="languages">
            <h2>Languages</h2>
        </section>
        <section id="programmingLanguages">
            <h2>Programming Languages</h2>
        </section>
        <section id="programmingTools">
            <h2>Programming Tools</h2>
        </section>
        <section id="itSupport">
            <h2>IT Support</h2>
        </section>
        <section id="other">
            <h2>Other</h2>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
